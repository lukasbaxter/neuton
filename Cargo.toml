[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
neuton-protocol = { path = "crates/neuton-protocol" }
neuton-blocks   = { path = "crates/neuton-blocks" }

# Release builds: this is a game. Optimise hard.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Dev builds still need playable framerates, so optimise deps.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
